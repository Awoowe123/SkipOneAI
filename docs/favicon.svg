<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ================= BACKGROUND ================= -->
  <rect width="128" height="128" rx="16" fill="#1A1D2E"/>
  <!-- Subtle circuit traces in background -->
  <g stroke="#252840" stroke-width="1" opacity="0.4">
    <line x1="8" y1="100" x2="8" y2="70"/>
    <line x1="8" y1="70" x2="20" y2="70"/>
    <line x1="20" y1="70" x2="20" y2="55"/>
    <circle cx="20" cy="55" r="2" fill="none"/>
    <line x1="10" y1="110" x2="25" y2="110"/>
    <line x1="25" y1="110" x2="25" y2="95"/>
    <circle cx="25" cy="95" r="2" fill="none"/>
    <line x1="5" y1="85" x2="15" y2="85"/>
    <circle cx="15" cy="85" r="1.5" fill="none"/>
  </g>

  <!-- ================= DROP SHADOW ================= -->
  <rect x="24" y="40" width="82" height="72" rx="10" fill="#0D0F18" opacity="0.6"/>

  <!-- ================= MAIN HEAD ================= -->
  <!-- Base head shape - boxy with rounded corners -->
  <rect x="20" y="35" width="82" height="72" rx="10" fill="#6B6B7B" stroke="#2A2A35" stroke-width="2.5"/>
  <!-- Darker bottom half for depth -->
  <rect x="20" y="70" width="82" height="37" rx="0 0 10 10" fill="#5A5A6A" stroke="none"/>
  <rect x="20" y="70" width="82" height="37" rx="10" fill="#5A5A6A" stroke="#2A2A35" stroke-width="2.5" clip-path="inset(0 0 0 0)"/>
  <!-- Re-draw full outline -->
  <rect x="20" y="35" width="82" height="72" rx="10" fill="none" stroke="#2A2A35" stroke-width="2.5"/>

  <!-- Panel lines -->
  <line x1="28" y1="43" x2="28" y2="100" stroke="#4E4E5E" stroke-width="1"/>
  <line x1="94" y1="43" x2="94" y2="100" stroke="#4E4E5E" stroke-width="1"/>
  <line x1="30" y1="70" x2="92" y2="70" stroke="#4E4E5E" stroke-width="0.8"/>

  <!-- Rivets/bolts -->
  <circle cx="32" cy="42" r="1.5" fill="#4E4E5E" stroke="#3A3A4A" stroke-width="0.5"/>
  <circle cx="90" cy="42" r="1.5" fill="#4E4E5E" stroke="#3A3A4A" stroke-width="0.5"/>
  <circle cx="32" cy="100" r="1.5" fill="#4E4E5E" stroke="#3A3A4A" stroke-width="0.5"/>
  <circle cx="90" cy="100" r="1.5" fill="#4E4E5E" stroke="#3A3A4A" stroke-width="0.5"/>
  <circle cx="45" cy="75" r="1" fill="#4E4E5E" stroke="#3A3A4A" stroke-width="0.5"/>
  <circle cx="77" cy="75" r="1" fill="#4E4E5E" stroke="#3A3A4A" stroke-width="0.5"/>

  <!-- ================= ANGRY V-BROW ================= -->
  <g stroke="#2A2A35" stroke-width="2.5" stroke-linejoin="round" fill="#555565">
    <!-- Left brow plate -->
    <polygon points="34,52 60,58 60,54 38,47"/>
    <!-- Right brow plate -->
    <polygon points="88,52 62,58 62,54 84,47"/>
  </g>

  <!-- ================= LEFT EYE (Yellow/Organic) ================= -->
  <g>
    <!-- Eye socket -->
    <polygon points="36,56 56,60 56,70 36,70" fill="#3A3A4A" stroke="#2A2A35" stroke-width="1.5"/>
    <!-- Eyeball -->
    <circle cx="46" cy="64" r="7" fill="#E8D44D" stroke="#2A2A35" stroke-width="1.5"/>
    <!-- Pupil -->
    <circle cx="46" cy="64" r="3.5" fill="#1A1A20"/>
    <!-- Glint -->
    <circle cx="44" cy="62" r="1.2" fill="#FFFFF0" opacity="0.8"/>
  </g>

  <!-- ================= RIGHT EYE (Red/Mechanical) ================= -->
  <g>
    <!-- Eye socket -->
    <polygon points="66,60 86,56 86,70 66,70" fill="#3A3A4A" stroke="#2A2A35" stroke-width="1.5"/>
    <!-- Outer ring -->
    <circle cx="76" cy="64" r="7" fill="#4A4A55" stroke="#2A2A35" stroke-width="1.5"/>
    <!-- Inner ring -->
    <circle cx="76" cy="64" r="5" fill="#333340" stroke="#555" stroke-width="0.8"/>
    <!-- Red lens -->
    <circle cx="76" cy="64" r="3" fill="#CC2222"/>
    <!-- Red glow core -->
    <circle cx="76" cy="64" r="1.5" fill="#FF4444"/>
    <!-- Lens detail lines -->
    <line x1="73" y1="61" x2="79" y2="67" stroke="#555" stroke-width="0.5"/>
    <line x1="79" y1="61" x2="73" y2="67" stroke="#555" stroke-width="0.5"/>
    <!-- Glint -->
    <circle cx="74.5" cy="62.5" r="0.8" fill="#FF9999" opacity="0.7"/>
  </g>

  <!-- ================= NOSE ================= -->
  <g fill="#5A5A6A" stroke="#2A2A35" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="56,68 66,68 64,78 58,78"/>
  </g>

  <!-- ================= MOUTH ================= -->
  <g stroke="#2A2A35" stroke-width="2" stroke-linejoin="round">
    <!-- Mouth plate -->
    <polygon points="40,82 82,82 86,92 78,98 44,98 36,92" fill="#4A4A58"/>
    <!-- Inner dark mouth -->
    <polygon points="46,86 76,86 74,93 48,93" fill="#1A1A22"/>
    <!-- Teeth -->
    <rect x="54" y="86" width="5" height="5" rx="0.5" fill="#E8E8E0" stroke="#2A2A35" stroke-width="1"/>
    <rect x="62" y="86" width="5" height="5" rx="0.5" fill="#E8E8E0" stroke="#2A2A35" stroke-width="1"/>
  </g>

  <!-- ================= TELEGRAM LOGO ON FOREHEAD ================= -->
  <g fill="#FFFFFF" opacity="0.9">
    <polygon points="55,46 67,51 63,54 60,52" stroke="#2A2A35" stroke-width="0.8"/>
  </g>

  <!-- ================= LED RING (Detroit BH) on right temple ================= -->
  <circle cx="98" cy="62" r="5" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.9"/>
  <circle cx="98" cy="62" r="2" fill="#00E5FF" opacity="0.5"/>

  <!-- ================= LEFT LIGHTBULB (Intact, glowing orange) ================= -->
  <g>
    <!-- Base/socket -->
    <rect x="42" y="30" width="10" height="7" rx="1" fill="#5A5A6A" stroke="#2A2A35" stroke-width="1.5"/>
    <!-- Bulb capsule -->
    <rect x="43" y="12" width="8" height="20" rx="4" fill="#F5A623" stroke="#2A2A35" stroke-width="1.5"/>
    <!-- Filament glow -->
    <rect x="45.5" y="18" width="3" height="10" rx="1.5" fill="#FFD07A" opacity="0.7"/>
    <!-- Orange glow aura -->
    <rect x="41" y="10" width="12" height="24" rx="6" fill="#F5A623" opacity="0.15"/>
  </g>

  <!-- ================= RIGHT LIGHTBULB (Broken!) ================= -->
  <g>
    <!-- Base/socket -->
    <rect x="70" y="30" width="10" height="7" rx="1" fill="#5A5A6A" stroke="#2A2A35" stroke-width="1.5"/>
    <!-- Broken bulb stump -->
    <rect x="71" y="24" width="8" height="8" rx="1" fill="#4A4A55" stroke="#2A2A35" stroke-width="1.5"/>
    <!-- Jagged broken top -->
    <polygon points="71,24 73,18 75,22 77,16 79,21 80,24" fill="#4A4A55" stroke="#2A2A35" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Flying glass shards -->
    <g fill="#7A7A8A" stroke="#2A2A35" stroke-width="0.8">
      <polygon points="85,18 88,15 87,20" opacity="0.9"/>
      <polygon points="90,22 94,20 92,25" opacity="0.8"/>
      <polygon points="88,12 91,9 90,14" opacity="0.7"/>
      <polygon points="95,16 98,14 96,18" opacity="0.5"/>
      <polygon points="83,10 85,7 86,12" opacity="0.6"/>
      <polygon points="92,10 95,8 93,12" opacity="0.4"/>
    </g>
  </g>
</svg>
